# Used only by the isolated end-to-end test instance.
initial-window = false
window-save-state = never
quit-after-last-window-closed = false
confirm-close-surface = false
shell-integration = none
command = /bin/zsh -f
window-width = 160
window-height = 40
macos-option-as-alt = true

# Physical key names also work with Ghostty 1.3.x AppleScript send key,
# which does not populate the Unicode codepoint used by letter bindings.
keybind = performable:ctrl+key_h=goto_split:left
keybind = performable:ctrl+key_j=goto_split:down
keybind = performable:ctrl+key_k=goto_split:up
keybind = performable:ctrl+key_l=goto_split:right
keybind = performable:alt+key_h=resize_split:left,30
keybind = performable:alt+key_j=resize_split:down,30
keybind = performable:alt+key_k=resize_split:up,30
keybind = performable:alt+key_l=resize_split:right,30
# A harmless probe lets the harness observe when the table has been claimed.
keybind = f12=ignore
keybind = nvim/
keybind = nvim/ctrl+key_h=text:\x08
keybind = nvim/ctrl+key_j=text:\x0a
keybind = nvim/ctrl+key_k=text:\x0b
keybind = nvim/ctrl+key_l=text:\x0c
keybind = nvim/alt+key_h=esc:h
keybind = nvim/alt+key_j=esc:j
keybind = nvim/alt+key_k=esc:k
keybind = nvim/alt+key_l=esc:l
keybind = nvim/ctrl+key_z=text:\x1a
keybind = nvim/f12=csi:24~
